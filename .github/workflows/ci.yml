name: CI

# Tests on every push and pull request. On main the website container is also built and pushed to
# GitHub Container Registry (ghcr.io/<owner>/<repo>), ready for Azure Container Apps.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests (Core)
        run: dotnet test tests/Regneraeven.Core.Tests --configuration Release
      - name: Build website
        run: dotnet build src/Regneraeven.Server --configuration Release

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Azure template (Bicep)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

  image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
